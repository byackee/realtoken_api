services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodbpassword
    volumes:
      - /mnt/user/appdata/API/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8085:8080"
    environment:
      - NC_TOOL_DIR=/usr/app/data
      - DATABASE_URL=postgresql://nocodb:nocodbpassword@postgres:5432/nocodb
    volumes:
      - /mnt/user/appdata/API/nocodb/data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  geoip:
    build:
      context: ./geoip
      dockerfile: Dockerfile
    environment:
      - UPDATE_INTERVAL=7
    volumes:
      - geoip_data:/usr/share/GeoIP
    restart: unless-stopped
    network_mode: "bridge"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    ports:
      - "8086:8000"
    depends_on:
      - nocodb
      - geoip
    volumes:
      - ./fastapi:/app
      - geoip_data:/usr/share/GeoIP:ro
    environment:
      - NOCODB_URL=http://nocodb:8085
      - GEOIP_DB_PATH=/usr/share/GeoIP/GeoLite2-City.mmdb
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-geolocation-dashboard.json:/etc/grafana/provisioning/dashboards/geolocation-dashboard.json:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana-postgresql-datasource.yaml:/etc/grafana/provisioning/datasources/postgresql-datasource.yaml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=plaisir03
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

  codeserver:
    build:
      context: ./codeserver
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    volumes:
      - ./:/home/coder/project
    environment:
      - PASSWORD=plaisir03
    restart: unless-stopped

volumes:
  grafana_data:
  geoip_data: