services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodbpassword
    volumes:
      - /mnt/user/appdata/API/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  gnosis-node:
    image: nethermind/nethermind:latest
    container_name: gnosis-rpc
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/API/gnosis_rpc:/data
    ports:
      - "8545:8545"
      - "30303:30303"
      - "30303:30303/udp"
    command: >
      --config=gnosis
      --JsonRpc.Enabled=true
      --JsonRpc.Host=0.0.0.0
      --JsonRpc.Port=8545
      --JsonRpc.EnabledModules=["eth","net","web3","txpool"]
      --Sync.FastSync=false
      --Sync.SnapSync=true
      --Snapshot.DownloadUrl=https://checkpoint.gnosischain.com
      --Merge.Enabled=false
      --Init.IsMining=false
      --Init.DiagnosticMode=None
      --datadir=/data
    networks:
      - api-network

  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8085:8080"
    environment:
      - NC_TOOL_DIR=/usr/app/data
      - DATABASE_URL=postgresql://nocodb:nocodbpassword@postgres:5432/nocodb
    volumes:
      - /mnt/user/appdata/API/nocodb/data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - api-network

  geoip:
    build:
      context: ./geoip
      dockerfile: Dockerfile
    environment:
      - UPDATE_INTERVAL=7
    volumes:
      - geoip_data:/usr/share/GeoIP
    restart: unless-stopped
    networks:
      - api-network
 

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    ports:
      - "8086:8000"
    depends_on:
      - nocodb
      - geoip
    volumes:
      - ./fastapi:/app
      - ./scripts:/app/scripts
      - geoip_data:/usr/share/GeoIP:ro
    environment:
      - NOCODB_URL=http://nocodb:8085
      - GEOIP_DB_PATH=/usr/share/GeoIP/GeoLite2-City.mmdb
    restart: unless-stopped
    networks:
      - api-network

  cron-manager:
    build:
      context: ./cron-manager
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    depends_on:
      - postgres
    volumes:
      - ./cron-manager:/app
      - ./scripts:/app/scripts
    environment:
      - DB_HOST=postgres
      - DB_USER=nocodb
      - DB_PASSWORD=nocodbpassword
      - DB_NAME=nocodb
      - DB_PORT=5432
      - SCRIPTS_PATH=/app/scripts
      - LOGS_DIR=/app/logs
    restart: unless-stopped
    networks:
    - api-network 

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - api-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-geolocation-dashboard.json:/etc/grafana/provisioning/dashboards/geolocation-dashboard.json:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana-postgresql-datasource.yaml:/etc/grafana/provisioning/datasources/postgresql-datasource.yaml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=plaisir03
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped
    networks:
      - api-network

  codeserver:
    build:
      context: ./codeserver
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    volumes:
      - ./:/home/coder/project
    environment:
      - PASSWORD=plaisir03
    restart: unless-stopped
    networks:
      - api-network

volumes:
  grafana_data:
  geoip_data:
  gnosis_data:

networks:
  api-network:
    driver: bridge