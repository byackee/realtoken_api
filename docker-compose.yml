services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodbpassword
    volumes:
      - /mnt/user/appdata/API/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  gnosis-node:
    image: nethermind/nethermind:latest
    container_name: gnosis-rpc
    restart: unless-stopped
    ports:
      - "8545:8545"
      - "30303:30303"
      - "30303:30303/udp"
    volumes:
      - /mnt/user/appdata/API/gnosis_rpc:/data
    command: >
      --config=gnosis
      --JsonRpc.Enabled=true
      --JsonRpc.Host=0.0.0.0
      --JsonRpc.Port=8545
      --JsonRpc.EnabledModules=["eth","net","web3","txpool"]
      --Sync.FastSync=true
      --Merge.Enabled=false
      --Init.IsMining=false
      --Init.DiagnosticMode=None
      --datadir=/data
      --Network.Bootnodes="enode://54a7e6c8e974db0b6f0eb8ea1b12b8fca2f622b0b1c3a28b0ec2d1684414ac4b49cf11caa08d97ac933e0f015e8c1143a5c5409c4a291be58e4d1084324d68d@13.93.211.84:30303,enode://297d2b00f5a784d59c5d3b5ac0b6df7158cc53a254c80df8a5f3dcdd3c6bca4d0f0af3a7bde0d8b47a7f61ebd50e06c2f1a234567890abcdef@18.194.206.129:30303"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8545"]
      interval: 30s
      timeout: 10s
      retries: 5

  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8085:8080"
    environment:
      - NC_TOOL_DIR=/usr/app/data
      - DATABASE_URL=postgresql://nocodb:nocodbpassword@postgres:5432/nocodb
    volumes:
      - /mnt/user/appdata/API/nocodb/data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  geoip:
    build:
      context: ./geoip
      dockerfile: Dockerfile
    environment:
      - UPDATE_INTERVAL=7
    volumes:
      - geoip_data:/usr/share/GeoIP
    restart: unless-stopped
    network_mode: "bridge"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    ports:
      - "8086:8000"
    depends_on:
      - nocodb
      - geoip
    volumes:
      - ./fastapi:/app
      - geoip_data:/usr/share/GeoIP:ro
    environment:
      - NOCODB_URL=http://nocodb:8085
      - GEOIP_DB_PATH=/usr/share/GeoIP/GeoLite2-City.mmdb
    restart: unless-stopped

  cron-manager:
    build:
      context: ./cron-manager
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    depends_on:
      - postgres
    volumes:
      - ./cron-manager/scripts:/app/scripts
      - ./cron-manager/logs:/app/logs
    environment:
      - DB_HOST=postgres
      - DB_USER=nocodb
      - DB_PASSWORD=nocodbpassword
      - DB_NAME=nocodb
      - DB_PORT=5432
      - SCRIPTS_PATH=/app/scripts
      - LOGS_DIR=/app/logs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-geolocation-dashboard.json:/etc/grafana/provisioning/dashboards/geolocation-dashboard.json:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana-postgresql-datasource.yaml:/etc/grafana/provisioning/datasources/postgresql-datasource.yaml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=plaisir03
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

  codeserver:
    build:
      context: ./codeserver
      dockerfile: Dockerfile
    ports:
      - "8087:8080"
    volumes:
      - ./:/home/coder/project
    environment:
      - PASSWORD=plaisir03
    restart: unless-stopped

volumes:
  grafana_data:
  geoip_data:
  gnosis_data: